# SPDX-License-Identifier: MIT
# Records the core's screens for the app's tests (../fixtures/screens). Not a
# member of the repository's workspace and not built by its cargo commands:
# ./run builds it when the flow's words change.
[package]
name = "record-screens"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
omamobile-installer-core = { path = "../../../core" }
serde_json = "1"
pollster = "1"
# What the core's own test support needs (core/tests/support/bundle.rs).
pgp = { version = "0.21", default-features = false }
rand = "0.8"
