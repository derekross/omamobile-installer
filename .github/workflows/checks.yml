# The gate for every push and pull request: no identifiers, formatted, the
# core's tests and the command-line tool's flow against the fake phone (as
# text and as JSON lines), the web page built both ways, and the desktop app
# built and tested against a stand-in and against the real tool with its
# pretend phone. Nothing here touches a USB device: the tests use a fake
# transport, and no step lists or opens USB devices.
name: Checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Identifiers, format, tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No identifiers
        run: tools/check-identifiers
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Lints (errors fail; warnings are listed)
        run: cargo clippy --locked
      - name: Tests (the core, against the fake phone; the install flow and the build index among them)
        run: cargo test --locked
      - name: Tests (the command-line tool driving the flow against the pretend phone, as text and as JSON lines)
        run: cargo test --locked -p omamobile-installer-cli --features fake-phone
      # web/build.sh needs wasm-bindgen-cli at exactly the wasm-bindgen
      # version in Cargo.lock. Built once per version and kept.
      - name: Which wasm-bindgen Cargo.lock names
        id: wbg
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no wasm-bindgen version in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen-cli, from an earlier run
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.wbg.outputs.version }}
      - name: wasm-bindgen-cli, built
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version "${{ steps.wbg.outputs.version }}"
      - name: The web page builds with the pretend phone (for its self-test)
        run: |
          web/build.sh selftest
          grep -q fake_phone web/dist/pkg/omamobile_installer_web.js
      - name: The web page builds as it would ship, without the pretend phone
        run: |
          web/build.sh
          test -s web/dist/pkg/omamobile_installer_web_bg.wasm
          test -s web/dist/index.html
          if grep -q fake_phone web/dist/pkg/omamobile_installer_web.js; then
            echo "the shipping build carries the pretend phone"; exit 1
          fi
          # The maintainer's bootloader-slot override: no way to set it from the page
          if grep -qiE 'slot_override|maintainer' web/dist/pkg/omamobile_installer_web.js web/dist/*.html; then
            echo "the shipping build offers the bootloader-slot override"; exit 1
          fi

  # The desktop app (app/). It needs Qt 6.5 or newer (the window uses
  # Material.roundedScale), and the runner's own distribution, Ubuntu 24.04,
  # packages Qt 6.4.2: the window does not load there. So this job runs in an
  # Arch Linux container, which is also what the app is built for.
  app:
    name: The desktop app, against a stand-in and against the real tool
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      # A font too: the image has none, and the test of the window at its
      # smallest size measures the buttons' labels.
      - name: Packages (Qt 6, a C++ compiler, Python for the tests' stand-in, a font, rustup)
        run: pacman -Syu --noconfirm --needed base-devel git python qt6-base qt6-declarative ttf-dejavu rustup
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: The app builds
        run: app/bin/build
      # app/bin/test builds omamobile-install with its pretend phone (cargo)
      # and runs the Qt tests offscreen: no window, no phone, no USB. A test
      # that was skipped means the real tool was not there, and fails the job.
      - name: The app's tests, with none skipped
        shell: bash
        run: |
          set -o pipefail
          app/bin/test | tee app-tests.log
          if grep -q '^SKIP' app-tests.log; then
            echo "a test of the app was skipped"; exit 1
          fi
