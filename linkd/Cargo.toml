[package]
name = "omamobile-linkd"
description = "The install link's daemon on the phone: the shell around the protocol crate's phone machine (Omarchy Mobile's INSTALL-LINK-PLAN, stage L2: a socket pair and a scratch root, no USB)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "omamobile-linkd"
path = "src/main.rs"

[[bin]]
name = "omamobile-install-link"
path = "src/bin/omamobile-install-link.rs"

[dependencies]
omamobile-link = { path = "../link" }
# The system calls std has no safe name for: the peer of a local socket
# (SO_PEERCRED), free space, the kernel's random numbers, a signal to
# itself for the kill test. The workspace already has this version.
rustix = { version = "1", features = ["fs", "net", "process", "rand", "time"] }

[dev-dependencies]
# The installer's side of the tests is the crate's own host machine and its
# stand-in shell.
omamobile-link = { path = "../link", features = ["sim"] }
